name: Deploy server

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            $ErrorActionPreference = 'Stop'
            try {
              Write-Output "STEP: cd deploy path"
              cd ${{ secrets.VM_DEPLOY_PATH }}

              Write-Output "STEP: git pull"
              git pull
              if ($LASTEXITCODE -ne 0) { throw "git pull failed with exit code $LASTEXITCODE" }

              Write-Output "STEP: cd server"
              cd server

              Write-Output "STEP: stop old server process"
              Get-NetTCPConnection -LocalPort 6154 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique | ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }

              Write-Output "STEP: gradlew installDist"
              .\gradlew.bat installDist --no-daemon
              if ($LASTEXITCODE -ne 0) { throw "gradlew installDist failed with exit code $LASTEXITCODE" }

              Write-Output "STEP: start server"
              # Start-Process alone doesn't survive the SSH session closing: Windows
              # nests child processes into the same Job Object as the SSH session by
              # default, and sshd kills that whole job when the session ends. A
              # Scheduled Task runs fully outside that job, so it survives.
              $taskName = "BrutalTankServer"
              $exePath = (Resolve-Path ".\build\install\brutaltank-server\bin\brutaltank-server.bat").Path
              schtasks /Delete /TN $taskName /F *>$null
              schtasks /Create /TN $taskName /TR $exePath /SC ONCE /ST 00:00 /RL HIGHEST /F
              if ($LASTEXITCODE -ne 0) { throw "schtasks /Create failed with exit code $LASTEXITCODE" }
              schtasks /Run /TN $taskName
              if ($LASTEXITCODE -ne 0) { throw "schtasks /Run failed with exit code $LASTEXITCODE" }

              Write-Output "STEP: done"
            } catch {
              Write-Output "DEPLOY FAILED: $($_.Exception.Message)"
              Write-Output "STACK TRACE: $($_.ScriptStackTrace)"
              exit 1
            }
