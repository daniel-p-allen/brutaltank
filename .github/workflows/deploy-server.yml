name: Deploy server

# Disabled 2026-08-29: the deploy VM is being retired in favor of a dedicated
# one (see CLAUDE.md / PLAN.md). Re-enable by restoring the `push` trigger
# below once the new VM's secrets (VM_HOST/VM_USER/VM_SSH_KEY/VM_DEPLOY_PATH)
# are set up.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [master]
  #   paths:
  #     - "server/**"
  #     - ".github/workflows/deploy-server.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            $ErrorActionPreference = 'Stop'
            try {
              Write-Output "STEP: cd deploy path"
              cd ${{ secrets.VM_DEPLOY_PATH }}

              Write-Output "STEP: git pull"
              git pull
              if ($LASTEXITCODE -ne 0) { throw "git pull failed with exit code $LASTEXITCODE" }

              Write-Output "STEP: cd server"
              cd server

              Write-Output "STEP: stop old server process"
              Get-NetTCPConnection -LocalPort 6154 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique | ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }

              Write-Output "STEP: gradlew installDist"
              .\gradlew.bat installDist --no-daemon
              if ($LASTEXITCODE -ne 0) { throw "gradlew installDist failed with exit code $LASTEXITCODE" }

              Write-Output "STEP: start server"
              # Start-Process alone doesn't survive the SSH session closing: Windows
              # nests child processes into the same Job Object as the SSH session by
              # default, and sshd kills that whole job when the session ends. A
              # Scheduled Task runs fully outside that job, so it survives.
              $taskName = "BrutalTankServer"
              $exePath = (Resolve-Path ".\build\install\brutaltank-server\bin\brutaltank-server.bat").Path
              Write-Output "exePath resolved to: $exePath"
              # schtasks won't run a .bat directly as /TR -- route it through cmd.exe /c.
              $trValue = "cmd.exe /c `"$exePath`""
              Write-Output "trValue: $trValue"
              # $ErrorActionPreference='Stop' promotes a native command's stderr output
              # into a terminating exception before it can be inspected -- drop to
              # 'Continue' just for these calls so we can see schtasks' real output
              # and check $LASTEXITCODE ourselves instead of guessing from a masked error.
              $prevEAP = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              $deleteOutput = schtasks /Delete /TN $taskName /F 2>&1 | Out-String
              Write-Output "schtasks /Delete output: $deleteOutput"
              $createOutput = schtasks /Create /TN $taskName /TR $trValue /SC ONCE /ST 00:00 /RL HIGHEST /F 2>&1 | Out-String
              $createExit = $LASTEXITCODE
              Write-Output "schtasks /Create output: $createOutput"
              Write-Output "schtasks /Create exit code: $createExit"
              $runOutput = schtasks /Run /TN $taskName 2>&1 | Out-String
              $runExit = $LASTEXITCODE
              Write-Output "schtasks /Run output: $runOutput"
              Write-Output "schtasks /Run exit code: $runExit"
              $ErrorActionPreference = $prevEAP
              if ($createExit -ne 0) { throw "schtasks /Create failed with exit code $createExit" }
              if ($runExit -ne 0) { throw "schtasks /Run failed with exit code $runExit" }

              Write-Output "STEP: done"
            } catch {
              Write-Output "DEPLOY FAILED: $($_.Exception.Message)"
              Write-Output "STACK TRACE: $($_.ScriptStackTrace)"
              exit 1
            }
